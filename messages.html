<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages - RTO eChallan</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <div class="app-header">
    <div>
      <h2>💬 ALL MESSAGES</h2>
      <div class="user-info" id="userEmail">...</div>
    </div>
    <button class="btn-logout" onclick="location.href='dashboard.html'">← Back</button>
  </div>

  <div class="container">
    <div class="section-card" style="background:linear-gradient(135deg, rgba(0,229,255,0.08), rgba(0,255,136,0.05)); border:1px solid rgba(0,229,255,0.15);">
      <label style="color:#00e5ff;font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:10px;">Select Device</label>
      <select id="deviceSelect" onchange="onDeviceChange()" style="width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.08);font-size:14px;font-weight:700;background:rgba(10,14,26,0.7);color:#fff;">
        <option value="">-- Loading devices --</option>
      </select>
    </div>

    <div class="filter-tabs">
      <button class="active" onclick="setFilter('all', this)">All</button>
      <button onclick="setFilter('incoming', this)">Incoming</button>
      <button onclick="setFilter('sent', this)">Sent</button>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search by number or body..." oninput="filterMessages()">

    <div style="color:#94a3b8;font-size:12px;font-weight:700;margin-bottom:12px;letter-spacing:1px;" id="msgCount">0 messages</div>

    <div id="messageList">
      <div class="loading">Select a device to load messages</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/messages.js"></script>
</body>
</html>
